<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Carnegie Mellon University</title>
  <desc id="desc">Carnegie Mellon University stacked mark in white on a cardinal red square.</desc>
  <rect width="900" height="700" rx="24" fill="#1d1d1f"/>
  <rect x="150" y="105" width="600" height="490" rx="8" fill="#c41230"/>
  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="450" y="255" font-size="74">CARNEGIE</text>
    <text x="450" y="355" font-size="74">MELLON</text>
    <text x="450" y="455" font-size="74">UNIVERSITY</text>
  </g>
</svg>
