    <script>
      (() => {
        const transition = document.querySelector('.page-transition');
        const grid = transition?.querySelector('.transition-grid');
        for (let index = 0; index < 12; index += 1) {
          const cell = document.createElement('span');
          cell.style.setProperty('--cell', index);
          cell.style.setProperty('--reverse-cell', 11 - index);
          grid?.append(cell);
        }
        let hasRevealed = false;
        const reveal = () => {
          if (hasRevealed) return;
          hasRevealed = true;
          let state = null;
          try {
            const raw = sessionStorage.getItem('alobi-route-reveal');
            state = raw ? JSON.parse(raw) : null;
          } catch {}
          if (state?.effect === 'line' || state?.effect === 'cleaner') {
            transition.className = 'page-transition';
            document.documentElement.classList.remove('route-enter-pending');
            document.getElementById('route-prepaint-style')?.remove();
            try { sessionStorage.removeItem('alobi-route-reveal'); } catch {}
            return;
          }
          if (transition && grid?.children.length) {
            transition.className = 'page-transition is-active effect-route-reveal';
            requestAnimationFrame(() => {
              document.documentElement.classList.remove('route-enter-pending');
              document.getElementById('route-prepaint-style')?.remove();
            });
            window.setTimeout(() => { transition.className = 'page-transition'; }, 1100);
          } else {
            document.documentElement.classList.remove('route-enter-pending');
            document.getElementById('route-prepaint-style')?.remove();
          }
          try { sessionStorage.removeItem('alobi-route-reveal'); } catch {}
        };
        requestAnimationFrame(() => requestAnimationFrame(reveal));
        window.addEventListener('pageshow', reveal, { once: true });

        document.querySelectorAll('[data-route]').forEach(link => link.addEventListener('click', event => {
          if (link.href === location.href) return;
          event.preventDefault();
          if (/ALOBI\s*\/\s*HOME/i.test(link.dataset.routeLabel || link.textContent.trim())) {
            try { sessionStorage.setItem('alobi-home-line-return', '1'); } catch {}
          }
          document.documentElement.classList.add('route-leaving');
          transition.className = 'page-transition is-active effect-cleaner-down';
          try {
            sessionStorage.setItem('alobi-route-reveal', JSON.stringify({
              label: link.dataset.routeLabel || link.textContent.trim(),
              effect: 'line',
              createdAt: Date.now()
            }));
          } catch {}
          window.setTimeout(() => {
            transition.classList.add('is-holding');
            window.setTimeout(() => location.assign(link.href), 148);
          }, 678);
        }));
      })();
    </script>
